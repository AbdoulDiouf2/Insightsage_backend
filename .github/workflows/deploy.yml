name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: git -C C:\Cockpit\repos\Insightsage_backend pull origin main

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: C:\Cockpit\repos\Insightsage_backend

      - name: Push Prisma schema to Cockpit DB
        env:
          DOTENV_CONFIG_PATH: .env
        run: npx prisma db push
        working-directory: C:\Cockpit\repos\Insightsage_backend

      # Le projet utilise db push et non migrate deploy. L'index partiel V2,
      # absent du schema Prisma, doit etre reapplique apres chaque db push.
      - name: Ensure V2 active-job uniqueness
        env:
          DOTENV_CONFIG_PATH: .env
        run: npx prisma db execute --file prisma/release/ensure-data-job-v2-index.sql
        working-directory: C:\Cockpit\repos\Insightsage_backend

      - name: Generate Prisma Client
        env:
          DOTENV_CONFIG_PATH: .env
        run: npx prisma generate
        working-directory: C:\Cockpit\repos\Insightsage_backend

      - name: Seed KPIs
        if: ${{ vars.RUN_KPI_SEED == 'true' }}
        env:
          DOTENV_CONFIG_PATH: .env
        run: npx ts-node prisma/seed-kpis.ts
        working-directory: C:\Cockpit\repos\Insightsage_backend

      - name: Build
        run: npm run build
        working-directory: C:\Cockpit\repos\Insightsage_backend

      - name: Reload PM2
        run: C:\Users\LAMARANA\AppData\Roaming\npm\pm2.cmd reload cockpit-api
